services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autovoice-api
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=INFO
      - API_PORT=8080
      - CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: autovoice-ui
    ports:
      - "8501:8501"
    environment:
      - AUTOVOICE_API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
